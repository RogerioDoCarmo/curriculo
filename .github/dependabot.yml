# Dependabot configuration for automated dependency updates and security alerts
# Documentation: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Enable version updates for npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"

    # Automatically create pull requests for dependency updates
    open-pull-requests-limit: 5

    # Group dependency updates to reduce PR noise
    groups:
      # Group all non-security updates together
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

      # Group production dependencies
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

    # Assignees for pull requests
    assignees:
      - "RogerioDoCarmo"

    # Labels for pull requests
    labels:
      - "dependencies"
      - "automated"

    # Commit message prefix
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"

    # Ignore specific dependencies (if needed)
    # ignore:
    #   - dependency-name: "package-name"
    #     versions: ["1.x", "2.x"]

    # Allow both direct and indirect dependencies
    allow:
      - dependency-type: "all"

    # Rebase strategy for pull requests
    rebase-strategy: "auto"

    # Target branch for pull requests
    target-branch: "develop"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"

    open-pull-requests-limit: 3

    assignees:
      - "RogerioDoCarmo"

    labels:
      - "dependencies"
      - "github-actions"
      - "automated"

    commit-message:
      prefix: "chore(ci)"
      include: "scope"

    target-branch: "develop"
