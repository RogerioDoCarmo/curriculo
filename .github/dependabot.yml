# Dependabot configuration for automated dependency updates and security alerts
# Documentation: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Enable version updates for npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"

    # Automatically create pull requests for dependency updates
    open-pull-requests-limit: 5

    # Group dependency updates to reduce PR noise
    groups:
      # Stryker's packages declare exact-version peer dependencies on each
      # other (jest-runner@X requires core@X exactly), so they can only be
      # bumped together. Listed first because a dependency joins the first
      # group whose patterns match, and majors are included because an
      # ungrouped major split this pair into two unresolvable PRs (#296/#297)
      # that shipped package.json without a lockfile and broke `npm ci`.
      stryker:
        patterns:
          - "@stryker-mutator/*"
        update-types:
          - "major"
          - "minor"
          - "patch"

      # Group all non-security updates together
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

      # Group production dependencies
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

    # Assignees for pull requests
    assignees:
      - "RogerioDoCarmo"

    # Labels for pull requests
    labels:
      - "dependencies"
      - "automated"

    # Commit message prefix
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"

    # Ignore specific dependencies
    ignore:
      # Playwright 1.62 and 1.63 regress WebKit on this suite. 1.63 hangs the
      # exit-intent modal specs (email-subscribe) and fails "the world pulse
      # stays inert" (#366, #368). 1.62.1 fails mobile-safari cookie-consent
      # "Change preferences" specs (437/477) and develop went red after #380;
      # an A/B on the E2E matrix was green twice on 1.61.0 and red on 1.62.1.
      # develop passes everything on 1.61.0, which is pinned exactly in
      # package.json. Remove once those specs pass on a newer Playwright.
      - dependency-name: "@playwright/test"
        versions: ["1.62.x", "1.63.x"]
      - dependency-name: "playwright"
        versions: ["1.62.x", "1.63.x"]

    # Allow both direct and indirect dependencies
    allow:
      - dependency-type: "all"

    # Rebase strategy for pull requests
    rebase-strategy: "auto"

    # Target branch for pull requests
    target-branch: "develop"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"

    open-pull-requests-limit: 3

    assignees:
      - "RogerioDoCarmo"

    labels:
      - "dependencies"
      - "github-actions"
      - "automated"

    commit-message:
      prefix: "chore(ci)"
      include: "scope"

    target-branch: "develop"
