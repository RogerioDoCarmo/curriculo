# TEMPORARY: runs only the filter-pulse probe on Linux WebKit, with and without
# CPU load, to find out why the pulse sometimes never starts on CI. Triggered by
# pushes to the investigation branch only. Delete with the branch.
name: Probe filter-pulse (temporary)

on:
  push:
    branches:
      - test/investigate-filter-pulse-webkit
    paths:
      - tests/e2e/zz-filter-pulse-probe.spec.ts
      - playwright.probe.config.ts
      - .github/workflows/probe-filter-pulse.yml

permissions:
  contents: read

jobs:
  probe:
    name: Probe (${{ matrix.browser }}, load=${{ matrix.load }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, mobile-safari]
        load: ["none", "cpu"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps webkit
      - name: Build
        run: npm run build
      - name: Serve
        run: |
          npx serve out -l 3000 > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:3000/en/ > /dev/null && break; sleep 1; done
      - name: Add CPU load
        if: matrix.load == 'cpu'
        run: |
          for i in 1 2; do (yes > /dev/null &) ; done
      - name: Run the probe
        run: |
          PROBE_COPIES=24 npx playwright test tests/e2e/zz-filter-pulse-probe.spec.ts \
            --project=${{ matrix.browser }} --retries=0 --workers=4 --reporter=list
        env:
          BASE_URL: http://localhost:3000
          PLAYWRIGHT_BASE_URL: http://localhost:3000
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-${{ matrix.browser }}-${{ matrix.load }}
          path: |
            playwright-report/
            test-results/
