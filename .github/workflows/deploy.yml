name: Deploy to Production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Configure npm (resilient registry timeouts/retries)
        run: |
          npm config set fetch-timeout 120000
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Check coverage threshold
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "❌ Coverage summary file not found"
            exit 1
          fi

          COVERAGE=$(node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')); console.log(data.total.lines.pct);")
          echo "Line Coverage: $COVERAGE%"

          if awk "BEGIN {exit !($COVERAGE < 71)}"; then
            echo "❌ Coverage ($COVERAGE%) is below 71% threshold"
            exit 1
          fi
          echo "✅ Coverage meets 71% threshold (goal: 90%)"

  mutation:
    name: Mutation Tests
    runs-on: ubuntu-latest
    # Non-blocking visibility check alongside the unit-test gate. Reports the
    # mutation score on every production deploy but never blocks it (not in the
    # deploy job's `needs`, and continue-on-error swallows a sub-threshold run).
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Configure npm (resilient registry timeouts/retries)
        run: |
          npm config set fetch-timeout 120000
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run mutation tests
        run: npm run test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN
          }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $DEPLOYMENT_URL"

      - name: Send deployment notification
        if: success()
        run: |
          echo "Deployment successful to ${{ steps.deploy.outputs.url }}"
          # TODO: Implement Firebase Admin SDK push notification
          # This requires setting up a Node.js script with Firebase Admin SDK
          # to send FCM notifications to subscribed users

  notify:
    name: Send Push Notification
    runs-on: ubuntu-latest
    needs: deploy
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Configure npm (resilient registry timeouts/retries)
        run: |
          npm config set fetch-timeout 120000
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Send FCM notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # Create notification script
          cat > send-notification.js << 'EOF'
          const { initializeApp, cert } = require('firebase-admin/app');
          const { getMessaging } = require('firebase-admin/messaging');

          // Initialize Firebase Admin SDK
          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          const app = initializeApp({
            credential: cert(serviceAccount)
          });

          // Send notification to topic
          const message = {
            notification: {
              title: '🚀 Website Updated!',
              body: 'The personal resume website has been successfully deployed with new updates.'
            },
            topic: 'deployments'
          };

          getMessaging(app).send(message)
            .then((response) => {
              console.log('✅ Notification sent successfully:', response);
              process.exit(0);
            })
            .catch((error) => {
              console.error('❌ Error sending notification:', error);
              process.exit(1);
            });
          EOF

          # Run the notification script
          node send-notification.js
